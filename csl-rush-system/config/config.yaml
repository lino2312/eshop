# CSL 抢购系统配置文件
# 此文件不会被打包到二进制中，可以随时修改

# 监控服务器配置
server:
  port: 8080
  check_interval_ms: 500  # 库存检查间隔（毫秒）

# 商品配置
product:
  name: "iPhone 17 Pro Max"
  url: "https://eshop.hkcsl.com/on/demandware.store/Sites-hkt-hk-Site/zh_HK/Product-Variation"
  pid: "IP17_promaxscol"  # 从商品页面URL提取
  color: "927"  # 颜色代码：927=银色, 31033=宇宙橙色, 31034=深墨蓝色
  storage: "1026"  # 内存代码：1025=256GB, 1026=512GB, 1027=1TB, 4697=2TB

# 账号配置（支持多账号）
accounts:
  - username: "your-email@example.com"
    password: "your-password"
  - username: "another-email@example.com"
    password: "another-password"

# 终端客户端配置
client:
  server_url: "ws://localhost:8080/ws"  # 监控服务器 WebSocket 地址
  headless: false  # 是否使用无头浏览器
  purchase_quantity: 2  # 购买数量
